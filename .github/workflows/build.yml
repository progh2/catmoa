name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt 런타임 라이브러리
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Qt 런타임 라이브러리 (Linux)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3
      - run: pip install -r requirements.txt pyinstaller
      - name: 태그와 __version__ 일치 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import src; print(src.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "태그 ${GITHUB_REF_NAME} ≠ src.__version__ v$v"; exit 1; }
      - name: 빌드
        run: python build.py
        env:
          CATMOA_GOOGLE_CLIENT_ID: ${{ secrets.CATMOA_GOOGLE_CLIENT_ID }}
          CATMOA_GOOGLE_CLIENT_SECRET: ${{ secrets.CATMOA_GOOGLE_CLIENT_SECRET }}
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v6
        with:
          name: catmoa-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/catmoa-windows-*.exe
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # 태그 사이 커밋을 읽어 릴리스 노트를 만든다
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - name: 릴리스 노트 생성 (커밋 → 한국어 변경 내역)
        run: python tools/release_notes.py --tag "${GITHUB_REF_NAME}" > NOTES.md && cat NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: NOTES.md
